<div class="relative">
  <!-- Botón de usuario -->
  <button
    app-button
    variant="unstyled"
    class="dropdown-toggle flex items-center text-gray-700 dark:text-gray-400"
    (click)="toggleDropdown($event)"
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen"
  >
    <span
      class="me-3 grid size-11 shrink-0 place-items-center rounded-lg bg-brand-500 text-sm font-semibold text-white"
      aria-hidden="true"
    >
      {{ initials }}
    </span>

    <span class="me-1 hidden text-sm font-medium sm:block">
      {{ user()?.name || 'Usuario' }}
    </span>

    <svg
      class="size-5 text-gray-500 duration-200 dark:text-gray-400"
      [ngClass]="isOpen ? 'rotate-180' : 'rotate-0'"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen) {
    <div
      class="absolute end-0 z-50 mt-3 flex w-65 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg outline-none dark:border-gray-800 dark:bg-[#1E2635]"
      role="menu"
    >
      <div class="px-3 py-2">
        <span class="block text-sm font-medium text-gray-800 dark:text-gray-200">
          {{ user()?.name || 'Usuario' }}
        </span>
        <span class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400">
          {{ user()?.email || '' }}
        </span>
        <span
          class="mt-2 inline-flex rounded-full bg-brand-50 px-2 py-0.5 text-[11px] font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-300"
        >
          {{ user()?.role || 'Sin rol' }}
        </span>
      </div>

      <div class="-mx-3 my-1.5 h-px bg-gray-100 dark:bg-gray-700"></div>

      <a
        routerLink="/cambiar-password"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
        role="menuitem"
      >
        <svg
          class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-item:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-item:text-gray-300"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15.75 7.5a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          <path d="M4.5 20.25a7.5 7.5 0 0 1 15 0M12 11.25v4.5m-2.25-2.25h4.5" />
        </svg>
        Cambiar contraseña
      </a>

      @if (canSeeConfiguration()) {
        <a
          routerLink="/configuracion"
          (click)="closeDropdown()"
          class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-700 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-gray-300"
          role="menuitem"
        >
          <svg
            class="size-6 shrink-0 text-gray-500 group-hover/dropdown-menu-item:text-gray-700 dark:text-gray-400 dark:group-hover/dropdown-menu-item:text-gray-300"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6.775 5.52a1.484 1.484 0 0 0-2.028.542L3.231 8.688c-.41.71-.166 1.617.543 2.027.99.571.99 1.999 0 2.57a1.484 1.484 0 0 0-.543 2.027l1.516 2.626c.41.71 1.318.953 2.028.543A1.484 1.484 0 0 1 9 19.766c0 .82.664 1.484 1.484 1.484h3.032c.82 0 1.484-.664 1.484-1.484a1.484 1.484 0 0 1 2.225-1.285c.71.41 1.617.167 2.027-.543l1.516-2.626c.41-.71.167-1.617-.543-2.027a1.484 1.484 0 0 1 0-2.57c.71-.41.953-1.317.543-2.027l-1.516-2.626a1.484 1.484 0 0 0-2.027-.543 1.483 1.483 0 0 1-2.225-1.285c0-.82-.664-1.484-1.484-1.484h-3.032c-.82 0-1.484.664-1.484 1.484a1.484 1.484 0 0 1-2.226 1.285Z" />
            <path d="M15.085 12a3.085 3.085 0 1 1-6.17 0 3.085 3.085 0 0 1 6.17 0Z" />
          </svg>
          Configuración
        </a>
      }

      <div class="-mx-3 my-1.5 h-px bg-gray-100 dark:bg-gray-700"></div>

      <button
        app-button
        variant="unstyled"
        type="button"
        (click)="logout()"
        class="group/dropdown-menu-item relative flex w-full cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-start text-sm font-medium text-red-500 outline-hidden transition-colors duration-200 select-none hover:bg-red-50 hover:text-red-600 dark:text-red-400 dark:hover:bg-red-500/10 dark:hover:text-red-400"
        role="menuitem"
      >
        <svg
          class="size-5 shrink-0 text-red-500 pointer-events-none dark:text-red-400"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 12h7.75M8 8l-3.998 4 3.997 4M9.75 4.996V4.25a1.5 1.5 0 0 1 1.5-1.5h6a1.5 1.5 0 0 1 1.5 1.5v15.5a1.5 1.5 0 0 1-1.5 1.5h-6a1.5 1.5 0 0 1-1.5-1.5V19" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  }
</div>
