<app-modal
  [open]="open"
  [title]="texts.consentRevokeTitle"
  size="md"
  [showFooter]="true"
  (closed)="close()"
>
  <div class="space-y-5">
    @if (error(); as apiError) {
      <app-alert variant="error" title="No se pudo revocar" [message]="apiError.message" />
    }

    <app-alert variant="warning" [message]="texts.consentRevokeHelp" />

    @if (consentimiento; as item) {
      <div class="rounded-lg bg-gray-50 p-4 dark:bg-gray-900">
        <p class="text-sm font-medium text-gray-800 dark:text-white/90">
          {{ item.tipo?.nombre || 'Consentimiento' }}
        </p>
        <p class="mt-1 text-xs text-gray-500">
          {{ item.tutor.nombre_completo || 'Tutor' }} · {{ item.fecha }}
        </p>
      </div>
    }

    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300" for="consentimiento-revoke-motivo">
        {{ texts.consentRevokeReason }}
      </label>
      <textarea
        id="consentimiento-revoke-motivo"
        app-textarea
        rows="3"
        [formControl]="form.controls.motivo"
        placeholder="Explicá el motivo de la revocación"
      ></textarea>
      @if (fieldError('motivo'); as message) {
        <p class="mt-1 text-xs text-red-500">{{ message }}</p>
      }
    </div>
  </div>

  <div modal-footer class="flex flex-wrap justify-end gap-2">
    <button app-button variant="outline" type="button" (click)="close()" [disabled]="saving()">
      {{ texts.cancel }}
    </button>
    <button app-button variant="default" type="button" (click)="submit()" [disabled]="saving()">
      {{ saving() ? texts.saving : texts.consentRevoke }}
    </button>
  </div>
</app-modal>
