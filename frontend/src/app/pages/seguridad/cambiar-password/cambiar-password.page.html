<app-page-breadcrumb pageTitle="Cambiar contraseña" />

<div class="mx-auto max-w-2xl">
  <app-component-card
    title="Cambiar contraseña"
    desc="Actualizá tu contraseña respetando la política de seguridad vigente."
  >
    @if (mustChange()) {
      <app-alert
        variant="warning"
        title="Cambio obligatorio"
        message="Estás usando una contraseña temporal. Debés cambiarla antes de seguir operando en el sistema."
      />
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-5" novalidate>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400" for="current-password">
          Contraseña actual <span class="text-red-500">*</span>
        </label>
        <input
          id="current-password"
          app-input
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
          class="h-11 w-full rounded-[10px] border border-gray-300 bg-white px-4 text-sm text-gray-800 shadow-theme-xs outline-hidden focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          [class.border-red-500]="fieldError('current_password') !== ''"
        />
        @if (fieldError('current_password')) {
          <p class="mt-1.5 text-sm text-red-500">{{ fieldError('current_password') }}</p>
        }
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400" for="new-password">
          Nueva contraseña <span class="text-red-500">*</span>
        </label>
        <input
          id="new-password"
          app-input
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          class="h-11 w-full rounded-[10px] border border-gray-300 bg-white px-4 text-sm text-gray-800 shadow-theme-xs outline-hidden focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          [class.border-red-500]="fieldError('password') !== ''"
        />
        @if (fieldError('password')) {
          <p class="mt-1.5 text-sm text-red-500">{{ fieldError('password') }}</p>
        }
        <p class="mt-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400">
          {{ policyHint }}
        </p>
      </div>

      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400" for="password-confirmation">
          Repetir nueva contraseña <span class="text-red-500">*</span>
        </label>
        <input
          id="password-confirmation"
          app-input
          type="password"
          formControlName="confirmation"
          autocomplete="new-password"
          class="h-11 w-full rounded-[10px] border border-gray-300 bg-white px-4 text-sm text-gray-800 shadow-theme-xs outline-hidden focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
          [class.border-red-500]="fieldError('confirmation') !== ''"
        />
        @if (fieldError('confirmation')) {
          <p class="mt-1.5 text-sm text-red-500">{{ fieldError('confirmation') }}</p>
        }
      </div>

      @if (errorMessage()) {
        <app-alert variant="error" title="No se pudo actualizar" [message]="errorMessage()!" />
      }

      <div class="flex items-center justify-end gap-3">
        <button
          app-button
          type="submit"
          [disabled]="saving()"
          class="h-11 rounded-[10px] bg-brand-500 px-5 text-sm font-medium text-white hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-brand-200 dark:disabled:bg-brand-800"
        >
          {{ saving() ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
      </div>
    </form>
  </app-component-card>
</div>
