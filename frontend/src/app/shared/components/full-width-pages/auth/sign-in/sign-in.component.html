<div [class]="'flex w-full flex-1 flex-col lg:w-1/2 ' + className">
  <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-8 sm:py-10">
    <div class="mb-8 lg:hidden">
      <app-brand-logo size="md" />
    </div>

    <div>
      <app-sign-in-header
        title="Iniciar sesión"
        description="Ingresa tus credenciales para acceder al sistema de gestión."
      />

      <app-sign-in-form-fields />

      <p
        class="mt-6 rounded-lg border border-gray-200 bg-gray-50 px-4 py-3 text-center text-xs leading-relaxed text-gray-600 dark:border-gray-700 dark:bg-white/5 dark:text-gray-400"
      >
        Acceso exclusivo para personal autorizado. Si no podés ingresar,
        contactá al Superadmin.
      </p>
    </div>
  </div>
</div>
