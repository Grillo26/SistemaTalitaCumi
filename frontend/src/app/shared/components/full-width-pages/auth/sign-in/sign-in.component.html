<div [class]="'flex w-full flex-1 flex-col lg:w-1/2 ' + className">
  <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-8 sm:py-10">
    <div class="mb-8 lg:hidden">
      <app-brand-logo size="sm" />
    </div>

    <div>
      <app-sign-in-header
        title="Iniciar sesión"
        description="Ingresa tus credenciales para acceder al sistema de gestión."
      />

      <app-sign-in-form-fields />

      <p
        class="mt-6 rounded-lg border border-brand-100 bg-brand-50 px-4 py-3 text-center text-xs leading-relaxed text-brand-700 dark:border-brand-500/20 dark:bg-brand-500/10 dark:text-brand-300"
      >
        Modo demo: cualquier correo y contraseña son válidos.
      </p>
    </div>
  </div>
</div>
