<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>TalitaCumi | Sistema de Gestión</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sistema de gestión de turnos, inscripciones y cobros del Centro Integral de Desarrollo Infantil TalitaCumi"
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        const saved = localStorage.getItem('theme-mode') || localStorage.getItem('theme');
        if (saved === 'dark' || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {
        /* almacenamiento no disponible */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
